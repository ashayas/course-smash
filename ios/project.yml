# Xcode project for the Course Smash iOS app. Generate it with `xcodegen` (see README.md).
name: CourseSmash
options:
  bundleIdPrefix: app.coursesmash
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    # Bump these for every App Store upload. CURRENT_PROJECT_VERSION must go up with each build.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  CourseSmash:
    type: application
    platform: iOS
    sources:
      - path: CourseSmash
      # The city art is the web app's own file, so both draw the same buildings.
      - path: ../public/city.js
        group: Shared with web
        buildPhase: resources
    dependencies:
      - package: SwiftMath
    entitlements:
      path: CourseSmash/CourseSmash.entitlements
    info:
      path: CourseSmash/Info.plist
      properties:
        CFBundleDisplayName: Course Smash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CSAPIBaseURL: https://coursesmash.app
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - InterTight-ExtraBold.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coursesmash.ios
        PRODUCT_NAME: CourseSmash
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: false
  CourseSmashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CourseSmashUITests
    dependencies:
      - target: CourseSmash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coursesmash.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: CourseSmash
schemes:
  CourseSmash:
    build:
      targets:
        CourseSmash: all
        CourseSmashUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CourseSmashUITests
    archive:
      config: Release
