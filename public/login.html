<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in to Course Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap"><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="Say what you want to learn. Course Smash builds a course of questions, reads how you answer and changes what comes next. Every course goes up as a building in your city.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Course Smash"><meta property="og:url" content="https://coursesmash.app/">
<meta property="og:title" content="Course Smash: build your city one course at a time">
<meta property="og:description" content="Say what you want to learn. Course Smash builds a course of questions, reads how you answer and changes what comes next.">
<meta property="og:image" content="https://coursesmash.app/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="An isometric island city where every building is a course">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:creator" content="@ashaya"><meta name="twitter:image" content="https://coursesmash.app/og.png">
</head>
<body class="login-page">
<main class="login">
  <div class="login-city" id="city" aria-hidden="true"></div>
  <h1 class="hero-title">Course Smash</h1>
  <p class="lead">Log in and tell me what you want to learn.</p>
  <form class="panel login-form" method="post" action="/login">
    <p class="form-error" id="error" role="alert" hidden></p>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button" type="submit">Log in</button>
  </form>
</main>
<footer class="site-footer"><span>Made by <a href="https://x.com/ashaya" rel="noopener" target="_blank">Ashaya</a></span></footer>
<script src="/login.js"></script>
<script src="/login-city.js" type="module"></script>
</body>
</html>
